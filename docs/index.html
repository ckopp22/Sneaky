<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<meta name="description" content="Sneaky: a stealth game. Sneak past the guards, solo or in online co-op.">
<meta property="og:title" content="Sneaky">
<meta property="og:description" content="Sneak past the guards, solo or in online co-op.">
<meta property="og:image" content="https://ckopp22.github.io/Sneaky/icon-512.png">
<meta property="og:type" content="website">
<title>Sneaky</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sneaky">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { --text: #e8eefa; --dim: #6a7aa0; --ui: assets/ui/; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0a0d14; color: var(--text); overflow: hidden;
  font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
[hidden] { display: none !important; }

.btn { font: inherit; line-height: 1; color: var(--text); background: none; cursor: pointer; height: 48px; min-width: 48px;
  border: 12px solid transparent; border-image-slice: 8 fill; border-image-width: 12px; border-image-repeat: stretch;
  image-rendering: pixelated; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; }
.btn img { width: 24px; height: 24px; image-rendering: pixelated; display: block; }
.btn:focus { outline: none; }
.btn:disabled { color: var(--dim); cursor: default; }
.primary { border-image-source: url(assets/ui/buttons/btn_primary.png); }
.primary:active { border-image-source: url(assets/ui/buttons/btn_primary_pressed.png); }
.secondary { border-image-source: url(assets/ui/buttons/btn_secondary.png); }
.secondary:active { border-image-source: url(assets/ui/buttons/btn_secondary_pressed.png); }
.success { border-image-source: url(assets/ui/buttons/btn_success.png); }
.success:active { border-image-source: url(assets/ui/buttons/btn_success_pressed.png); }
.primary:disabled, .secondary:disabled, .success:disabled { border-image-source: url(assets/ui/buttons/btn_disabled.png); }
.square { width: 48px; padding: 0; border-image-source: url(assets/ui/buttons/btn_square_secondary.png); }
.square:active { border-image-source: url(assets/ui/buttons/btn_square_secondary_pressed.png); }
.level { width: 150px; height: 90px; padding: 0; line-height: 1.3; text-align: center; white-space: pre-line;
  border-image-source: url(assets/ui/buttons/level_open.png); }
.level:active { border-image-source: url(assets/ui/buttons/level_open_pressed.png); }
.level.done { border-image-source: url(assets/ui/buttons/level_done.png); border-image-slice: 8; position: relative;
  background: rgb(48,140,92); background-clip: padding-box; }
.level.done::after { content: ""; position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: url(assets/ui/icons/icon_check.png) center / contain no-repeat; image-rendering: pixelated; }
.level img { width: 24px; height: 24px; margin: 4px auto 0; display: block; image-rendering: pixelated; }
.level:disabled { border-image-source: url(assets/ui/buttons/level_locked.png); }

.panel { border: 12px solid transparent; border-image: url(assets/ui/panels/panel.png) 8 fill / 12px stretch;
  image-rendering: pixelated; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
.panel .btn { width: 200px; }

#hud { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between;
  pointer-events: none; z-index: 5; }
#hud .btn { pointer-events: auto; }
#toggles { display: flex; gap: 8px; }
#music { width: 100px; }

#coop, #solo { width: 200px; }
#mainmenu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 14vh 16px 16px; gap: 0; }
#mainmenu img { width: min(420px, 90%, 70vh); image-rendering: pixelated; }
#menuguard { width: min(480px, 90%); aspect-ratio: 3 / 1; height: auto; max-height: 24vh; margin-top: 8px; pointer-events: none; }
.menubtns { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.menubtns .btn { width: 220px; }
.overlay .hint { margin: 0; text-align: center; color: var(--dim); line-height: 1.5; }
.overlay h2 { font-size: 28px; margin: 0 0 4px; font-weight: 400; text-align: center; }
#cgrid.watch { pointer-events: none; }
#lobby { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  gap: 16px; padding: 70px 16px 32px; overflow-y: auto; touch-action: pan-y; }
#lobby img { width: 328px; max-width: 90%; image-rendering: pixelated; }
#lobby h1 { font-size: 24px; font-weight: 400; margin: 0; }
#code { font-size: 36px; letter-spacing: 8px; min-height: 44px; color: #6effab; }
#codeinput { width: 200px; height: 44px; font: 24px system-ui; text-align: center; letter-spacing: 6px; text-transform: uppercase;
  color: var(--text); background: #0a0d14; border: 2px solid var(--dim); border-radius: 6px; -webkit-user-select: text; user-select: text; }
#lobbystatus { margin: 0; max-width: 240px; text-align: center; color: var(--dim); min-height: 40px; }
#select, #coopsel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  gap: 24px; padding: 70px 16px 32px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#select > :first-child, #coopsel > :first-child, #lobby > :first-child { margin-top: auto; }
#select > :last-child, #coopsel > :last-child, #lobby > :last-child { margin-bottom: auto; }
#select img, #coopsel img { width: 328px; max-width: 90%; image-rendering: pixelated; }
#select h1, #coopsel h1 { font-size: 24px; font-weight: 400; margin: 0; }
#grid, #cgrid { display: grid; grid-template-columns: repeat(5, 150px); gap: 16px; }
@media (max-width: 860px) { #grid, #cgrid { grid-template-columns: repeat(2, 150px); } }
@media (min-width: 861px) and (max-width: 1000px) { #grid, #cgrid { grid-template-columns: repeat(4, 150px); } }

#popup, #settings { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center;
  justify-content: center; z-index: 10; }
#ptitle { font-size: 28px; margin: 0 0 4px; font-weight: 400; text-align: center; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 11; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="mainmenu" hidden>
  <img src="assets/ui/graphics/logo_sneaky.png" alt="Sneaky">
  <canvas id="menuguard" width="960" height="320"></canvas>
  <div class="menubtns">
    <button class="btn primary" id="solo">Solo</button>
    <button class="btn success" id="coop">Co-op</button>
  </div>
</div>

<div id="select" hidden>
  <img src="assets/ui/graphics/logo_sneaky.png" alt="Sneaky">
  <h1>Select Level</h1>
  <div id="grid"></div>
</div>

<div id="coopsel" class="screen" hidden>
  <img src="assets/ui/graphics/logo_sneaky.png" alt="Sneaky">
  <h1 id="cstatus"></h1>
  <div id="cgrid"></div>
</div>

<div id="lobby" class="screen" hidden>
  <img src="assets/ui/graphics/logo_sneaky.png" alt="Sneaky">
  <h1>Co-op</h1>
  <div class="panel">
    <button class="btn primary" id="host">Host Game</button>
    <div id="code"></div>
    <input id="codeinput" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button class="btn primary" id="join">Join Game</button>
    <p id="lobbystatus"></p>
  </div>
</div>

<div id="hud">
  <div id="toggles">
    <button class="btn square" id="sfx"><img alt="Sound" src="assets/ui/icons/icon_sound_on.png"></button>
    <button class="btn secondary" id="music">Music</button>
  </div>
  <button class="btn square" id="backbtn" hidden><img alt="Back" src="assets/ui/icons/icon_back.png"></button>
  <button class="btn square" id="settingsbtn" hidden><img alt="Settings" src="assets/ui/icons/icon_settings.png"></button>
  <button class="btn square" id="pause" hidden><img alt="Pause" src="assets/ui/icons/icon_pause.png"></button>
</div>

<div id="settings" class="overlay" hidden>
  <div class="panel">
    <h2>Settings</h2>
    <p class="hint">Move: WASD / arrows, or touch and drag.<br>Esc or the pause button pauses.</p>
    <button class="btn success" id="share">Share Game</button>
    <button class="btn secondary" id="reset">Reset Progress</button>
    <button class="btn primary" id="sclose">Close</button>
  </div>
</div>

<div id="popup" class="overlay" hidden>
  <div class="panel">
    <h2 id="ptitle"></h2>
    <button class="btn success" id="resume">Resume</button>
    <button class="btn primary" id="retry">Try Again</button>
    <button class="btn success" id="next">Next Level</button>
    <button class="btn secondary" id="pick">Choose Level</button>
    <button class="btn secondary" id="menu">Levels</button>
  </div>
</div>

<canvas id="confetti" hidden></canvas>

<script src="peerjs.min.js"></script>
<script src="game.js"></script>
</body>
</html>
